<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Company Bingo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#18142c; --ink-soft:#5c5872; --ink-line:#2a2547;
    --paper:#fffdf7; --paper-dim:#f4ecd8; --line:#e4d6ae;
    --gold:#e0a527; --gold-dark:#a97a12; --gold-ink:#2a1c02;
    --coral:#e2543f; --coral-dark:#ad3c2b;
    --green:#3f8f5f; --green-dark:#256b41;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper-dim);color:var(--ink);
    font-family:"Space Grotesk",system-ui,"Noto Sans TC",sans-serif;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  .hidden{display:none !important;}

  button{
    cursor:pointer;border-radius:8px;border:1.5px solid var(--line);padding:7px 13px;
    background:var(--paper);color:var(--ink);font-family:inherit;font-weight:500;font-size:13px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover:not(:disabled){transform:translateY(-1px);}
  button.primary{background:var(--gold);border-color:var(--gold-dark);color:var(--gold-ink);font-weight:700;}
  button.danger{background:var(--coral);border-color:var(--coral-dark);color:#fff8f5;}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  /* ===== 頂欄：霓虹招牌感 ===== */
  .topbar{
    background:var(--ink);color:#f4ecd8;padding:12px 18px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
    border-bottom:3px solid var(--gold);
  }
  .topbar .brand{font-size:19px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
  .topbar .brand .ver{margin-left:8px;font-size:10px;font-weight:500;letter-spacing:0;color:#8b83a8;text-transform:none;}
  .topbar .right{display:flex;align-items:center;gap:10px;font-size:12px;flex-wrap:wrap;color:#c9c2e0;}
  .topbar a.toggle{color:var(--gold);text-decoration:underline;cursor:pointer;font-size:12px;}
  .topbar button.small{font-size:11px;padding:4px 9px;background:transparent;border-color:#443d6b;color:#e9e3fa;}

  /* ===== Modal ===== */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,16,40,.6);display:flex;align-items:center;justify-content:center;z-index:60;}
  .modal{background:var(--paper);border-radius:14px;padding:20px;width:320px;max-width:90vw;box-shadow:0 20px 50px rgba(0,0,0,.35);border:1px solid var(--line);}
  .modal h3{margin:0 0 10px;font-size:17px;}
  .modal input{width:100%;padding:8px 9px;border-radius:8px;border:1.5px solid var(--line);font-size:14px;margin-bottom:10px;font-family:inherit;background:#fff;}

  /* ===== 大廳 ===== */
  .lobby{max-width:880px;margin:18px auto;padding:0 14px;}
  .card{background:var(--paper);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(24,20,44,.06);margin-bottom:14px;border:1px solid var(--line);}
  .card h2{margin:0 0 12px;font-size:16px;letter-spacing:.3px;}
  .lobby label{font-size:12px;display:block;margin:8px 0 3px;color:var(--ink-soft);}
  .lobby input{width:100%;padding:8px 9px;border-radius:8px;border:1.5px solid var(--line);font-size:14px;font-family:inherit;background:#fff;}
  .room-list{list-style:none;margin:6px 0 0;padding:0;}
  .room-list li{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:14px;}
  .room-list li:last-child{border-bottom:none;}
  .room-list .name{font-weight:600;}
  .muted{color:var(--ink-soft);font-size:12px;}

  /* ===== 三欄主畫面 ===== */
  .game-wrap{display:flex;gap:12px;padding:12px;align-items:flex-start;max-width:1180px;margin:0 auto;}
  .col{background:var(--paper);border-radius:14px;box-shadow:0 2px 10px rgba(24,20,44,.06);padding:14px;border:1px solid var(--line);}
  .col-left{width:200px;min-width:180px;display:flex;flex-direction:column;gap:9px;}
  .col-center{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;}
  .col-right{width:290px;min-width:220px;}

  .col-left h3{margin:0;font-size:14px;letter-spacing:.3px;}
  .section-label{font-size:11px;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase;margin:2px 0 6px;text-align:center;}
  .left-header{display:flex;justify-content:space-between;align-items:center;}
  #clearOrderBtn,#deleteRoomBtn{width:100%;font-size:12px;padding:5px;}
  #playerListEl{display:flex;flex-direction:column;gap:4px;}

  .player-row{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:9px;font-size:13px;background:var(--paper-dim);}
  .player-row.me{background:#fbeecb;box-shadow:inset 0 0 0 1.5px var(--gold);}
  .player-row.offline{opacity:.5;}
  .player-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .player-row .order-badge{
    min-width:20px;height:20px;text-align:center;line-height:20px;border-radius:999px;
    background:var(--ink);color:var(--gold);font-size:11px;font-family:"IBM Plex Mono",monospace;font-weight:600;
  }
  .player-row.clickable{cursor:pointer;}
  .player-row.clickable:hover{box-shadow:inset 0 0 0 1.5px var(--gold-dark);}
  .transfer-btn{
    border:none;background:none;color:var(--ink-soft);font-size:13px;padding:0 2px;cursor:pointer;line-height:1;
  }
  .transfer-btn:hover{color:var(--gold-dark);transform:none;}
  #refreshCardBtn{width:100%;margin-top:auto;}

  /* ===== 中欄：轉盤提示 + 彩球 ===== */
  .turn-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 0 12px;min-height:36px;}
  .turn-hint{
    font-size:16px;font-weight:700;color:var(--gold-ink);text-align:center;
    background:var(--gold);padding:6px 18px;border-radius:999px;border:1.5px solid var(--gold-dark);
    box-shadow:0 3px 0 var(--gold-dark);
  }
  .turn-hint.idle{font-size:12px;font-weight:500;color:var(--ink-soft);background:none;border:1.5px dashed var(--line);box-shadow:none;padding:5px 16px;}

  .public-grid{display:grid;grid-template-columns:repeat(10,34px);gap:6px;justify-content:center;}
  .num-btn{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;user-select:none;
    font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .num-btn.active{
    background:var(--gold);color:var(--gold-ink);border-color:var(--gold-dark);
    transform:scale(1.08);box-shadow:0 2px 6px rgba(224,165,39,.55);
  }
  .num-btn:disabled{cursor:not-allowed;opacity:.4;transform:none;}

  .brag-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 4px;}
  .bingo-count-label{
    font-size:14px;font-weight:700;background:var(--ink);color:var(--gold);
    padding:6px 14px;border-radius:9px;font-family:"IBM Plex Mono",monospace;
  }
  .brag-msg{font-size:12px;color:var(--coral-dark);margin:2px 0 8px;text-align:center;height:14px;font-weight:600;}

  .ticket-divider{
    width:100%;max-width:300px;border-top:2px dashed var(--line);margin:8px 0 10px;position:relative;
  }
  .my-card-grid{display:grid;grid-template-columns:repeat(5,54px);grid-auto-rows:54px;gap:7px;}
  .my-card-grid .num-btn{width:54px;height:54px;font-size:17px;}

  /* ===== 右欄：日誌 ===== */
  .log-box{
    background:var(--ink);color:#d9d2f0;border-radius:10px;padding:10px;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;height:520px;overflow-y:auto;white-space:pre-wrap;
    border:1px solid var(--ink-line);
  }

  .ready-actions{display:flex;gap:8px;margin-bottom:10px;}
  .ready-actions button{flex:1;}
  .ready-status-row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;}
  .st-ready{color:var(--green-dark);font-weight:600;}
  .st-wait{color:var(--coral-dark);}

  @media (max-width:940px){
    .game-wrap{flex-direction:column;align-items:stretch;padding:10px;}
    .col-left,.col-right{width:100%;}
    .public-grid{grid-template-columns:repeat(10,28px);gap:4px;}
    .num-btn{width:28px;height:28px;font-size:10px;}
    .my-card-grid{grid-template-columns:repeat(5,48px);grid-auto-rows:48px;}
    .my-card-grid .num-btn{width:48px;height:48px;font-size:15px;}
    .log-box{height:260px;}
  }
</style>
</head>
<body>

<div id="nicknameModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3>先取個暱稱 👋</h3>
    <input id="nicknameInput" type="text" maxlength="16" placeholder="輸入你的暱稱" />
    <p class="muted" style="margin-top:-6px;">只會存在這台電腦。</p>
    <button class="primary" id="saveNicknameBtn" style="width:100%;">進入</button>
  </div>
</div>

<div class="topbar">
  <div class="brand">🎟️ Company Bingo <span class="ver mono" id="versionTag"></span></div>
  <div class="right">
    <span id="roomLabel"></span>
    <button id="leaveRoomBtn" class="small hidden">離開房間</button>
    <a class="toggle" id="toggleLobbyBtn">顯示房間設定</a>
  </div>
</div>

<div id="lobbySection" class="lobby">
  <div class="card">
    <h2>建立房間</h2>
    <label>房間名稱</label>
    <input id="createRoomName" type="text" maxlength="20" placeholder="例如：夜班 Bingo" />
    <label>房間密碼（可留空）</label>
    <input id="createRoomPwd" type="password" maxlength="20" />
    <button class="primary" id="createRoomBtn" style="margin-top:10px;">建立房間</button>
  </div>
  <div class="card">
    <h2>已建立房間</h2>
    <ul id="roomListEl" class="room-list"></ul>
  </div>
</div>

<div id="gameSection" class="game-wrap hidden">
  <div class="col col-left">
    <div class="left-header">
      <h3>玩家排序</h3>
      <button id="lockBtn" class="primary" style="font-size:12px;padding:4px 8px;">鎖定</button>
    </div>
    <button id="clearOrderBtn">清除排序</button>
    <div id="playerListEl"></div>
    <button id="deleteRoomBtn" class="danger hidden">刪除房間</button>
    <button id="refreshCardBtn">刷新我的卡片</button>
  </div>

  <div class="col col-center">
    <div class="turn-row">
      <span id="turnHintEl" class="turn-hint idle"></span>
      <button id="skipTurnBtn" class="hidden" style="font-size:12px;padding:4px 8px;">跳過此玩家（離線）</button>
    </div>
    <div class="section-label">公共號碼 1–50</div>
    <div id="publicGridEl" class="public-grid"></div>

    <div class="brag-row">
      <button id="bragBtn" disabled>🎊 炫耀</button>
      <div class="bingo-count-label">BINGO：<span id="bingoCountEl">0</span> 條</div>
    </div>
    <div id="bragMsgEl" class="brag-msg"></div>

    <div class="ticket-divider"></div>
    <div class="section-label">我的卡片</div>
    <div id="myCardEl" class="my-card-grid"></div>
  </div>

  <div class="col col-right">
    <h3 style="margin:0 0 10px;font-size:14px;letter-spacing:.3px;">📻 日誌</h3>
    <div id="logBoxEl" class="log-box"></div>
  </div>
</div>

<div id="readyModal" class="modal-backdrop hidden">
  <div class="modal" style="width:360px;">
    <h3>準備開始？</h3>
    <p class="muted" style="margin-top:-6px;">任何人按「取消」都會中止準備。</p>
    <div class="ready-actions">
      <button class="primary" id="readyBtn">準備</button>
      <button id="readyCancelBtn">取消</button>
    </div>
    <div id="readyStatusEl"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getDatabase, ref, set, get, update, remove, push,
  onValue, onDisconnect, runTransaction
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

/* ===== Firebase：沿用現有專案 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyB4IBPbuGxztyzd8E3YTitMoTt8L19MSG0",
  authDomain: "company-bingo.firebaseapp.com",
  databaseURL: "https://company-bingo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "company-bingo",
  storageBucket: "company-bingo.appspot.com",
  messagingSenderId: "844173689886",
  appId: "1:844173689886:web:ac2f1888f542b138861a0f"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

/* ===== 版本號：每次修改都會更新，方便確認 GitHub 上是不是最新版 ===== */
const APP_VERSION = "v26.8.8.5";
document.getElementById("versionTag").textContent = APP_VERSION;
console.log("Company Bingo", APP_VERSION);

/* ===== 密碼雜湊（僅做基本遮蔽，不是高安全等級） ===== */
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ===== 本地身份 ===== */
let myUid = localStorage.getItem("bingo_uid");
if (!myUid) {
  myUid = "u_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  localStorage.setItem("bingo_uid", myUid);
}
let myName = localStorage.getItem("bingo_nickname") || "";

let currentRoomId = null;
let isHost = false;
let roomMeta = {};
let players = {};
let calledNumbers = {};
let myBoard = [];
let unsubs = [];
let hadValidMeta = false; // 用來偵測房間是否被刪除

let bragState = { count: 0, times: 0, locked: false };

/* ===== DOM ===== */
const $ = (id) => document.getElementById(id);

const nicknameModal   = $("nicknameModal");
const nicknameInput   = $("nicknameInput");
const saveNicknameBtn = $("saveNicknameBtn");

const roomLabelEl     = $("roomLabel");
const leaveRoomBtn    = $("leaveRoomBtn");
const toggleLobbyBtn  = $("toggleLobbyBtn");
const lobbySection    = $("lobbySection");
const gameSection     = $("gameSection");

const createRoomName  = $("createRoomName");
const createRoomPwd   = $("createRoomPwd");
const createRoomBtn   = $("createRoomBtn");
const roomListEl      = $("roomListEl");

const playerListEl    = $("playerListEl");
const clearOrderBtn   = $("clearOrderBtn");
const deleteRoomBtn   = $("deleteRoomBtn");
const lockBtn         = $("lockBtn");
const refreshCardBtn  = $("refreshCardBtn");

const turnHintEl      = $("turnHintEl");
const skipTurnBtn     = $("skipTurnBtn");
const publicGridEl    = $("publicGridEl");
const bragBtn         = $("bragBtn");
const bingoCountEl    = $("bingoCountEl");
const bragMsgEl       = $("bragMsgEl");
const myCardEl        = $("myCardEl");
const logBoxEl        = $("logBoxEl");

const readyModal      = $("readyModal");
const readyBtn        = $("readyBtn");
const readyCancelBtn  = $("readyCancelBtn");
const readyStatusEl   = $("readyStatusEl");

/* ===== 工具 ===== */
function randomBoard() {
  const nums = Array.from({ length: 50 }, (_, i) => i + 1);
  for (let i = nums.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nums[i], nums[j]] = [nums[j], nums[i]];
  }
  return nums.slice(0, 25);
}
function pushLog(text) {
  if (!currentRoomId) return;
  push(ref(db, `rooms/${currentRoomId}/logs`), { text, timestamp: Date.now() });
}
function orderedPlayers() {
  return Object.entries(players)
    .filter(([, p]) => p.order != null)
    .sort((a, b) => a[1].order - b[1].order);
}
function nextAvailableOrder() {
  const used = new Set(Object.values(players).map(p => p.order).filter(v => v != null));
  let i = 1; while (used.has(i)) i++;
  return i;
}
function calcBingoLines(board, selectedSet) {
  if (board.length !== 25) return 0;
  const hit = (i) => selectedSet.has(board[i]);
  let lines = 0;
  for (let r = 0; r < 5; r++) if ([0,1,2,3,4].every(c => hit(r*5+c))) lines++;
  for (let c = 0; c < 5; c++) if ([0,1,2,3,4].every(r => hit(r*5+c))) lines++;
  if ([0,1,2,3,4].every(i => hit(i*6))) lines++;
  if ([0,1,2,3,4].every(i => hit((i+1)*4))) lines++;
  return lines;
}

/* ===== 匿名登入（配合資料庫規則需要 auth != null） ===== */
signInAnonymously(auth).catch(err => {
  console.error("匿名登入失敗", err);
  alert("登入 Firebase 失敗，請確認已在 Firebase 主控台開啟 Anonymous 登入方式。");
});
onAuthStateChanged(auth, (user) => {
  if (user) initNickname();
});

/* ===== 昵称流程 ===== */
function initNickname() {
  if (myName) tryAutoRejoin();
  else nicknameModal.classList.remove("hidden");
}
saveNicknameBtn.addEventListener("click", () => {
  const name = nicknameInput.value.trim();
  if (!name) { alert("暱稱不能空白"); return; }
  myName = name;
  localStorage.setItem("bingo_nickname", myName);
  nicknameModal.classList.add("hidden");
  tryAutoRejoin();
});

async function tryAutoRejoin() {
  const lastRoomId = localStorage.getItem("bingo_last_room");
  if (lastRoomId) {
    const snap = await get(ref(db, `rooms/${lastRoomId}/meta`));
    if (snap.exists()) { await joinRoomById(lastRoomId, null, true); return; }
    localStorage.removeItem("bingo_last_room");
  }
  showLobby();
  listenRoomList();
}

/* ===== 大厅 / 房间列表 ===== */
let roomListUnsub = null;
function listenRoomList() {
  if (roomListUnsub) return;
  roomListUnsub = onValue(ref(db, "rooms"), (snap) => {
    const val = snap.val() || {};
    roomListEl.innerHTML = "";
    const entries = Object.entries(val)
      .filter(([, r]) => r.meta)
      .sort((a, b) => (a[1].meta.createdAt || 0) - (b[1].meta.createdAt || 0));

    if (!entries.length) {
      const li = document.createElement("li");
      li.className = "muted";
      li.textContent = "目前沒有房間，建立一個吧。";
      roomListEl.appendChild(li);
      return;
    }
    for (const [roomId, room] of entries) {
      const li = document.createElement("li");
      const left = document.createElement("span");
      left.className = "name";
      left.textContent = (room.meta.hasPassword ? "🔒 " : "") + (room.meta.name || "未命名房間");

      const joinBtn = document.createElement("button");
      joinBtn.textContent = "加入";
      joinBtn.addEventListener("click", async () => {
        let pwd = "";
        if (room.meta.hasPassword) pwd = prompt("此房間需要密碼：") || "";
        await joinRoomById(roomId, pwd, false);
      });

      li.appendChild(left); li.appendChild(joinBtn);
      roomListEl.appendChild(li);
    }
  });
}

createRoomBtn.addEventListener("click", async () => {
  const name = createRoomName.value.trim() || "未命名房間";
  const pwd  = createRoomPwd.value || "";
  const passwordHash = pwd ? await sha256(pwd) : null;

  const newRoomRef = push(ref(db, "rooms"));
  const roomId = newRoomRef.key;

  await set(ref(db, `rooms/${roomId}/meta`), {
    name, hostId: myUid, hasPassword: !!pwd, passwordHash,
    createdAt: Date.now(), gameState: "lobby", turnIndex: 0
  });

  createRoomName.value = ""; createRoomPwd.value = "";
  await joinRoomById(roomId, pwd, true);
});

/* 離開某房間的共用清理邏輯：移除玩家資料與卡片，房間空了就整個刪除 */
async function leaveRoomCleanup(roomId) {
  if (!roomId) return;
  try { push(ref(db, `rooms/${roomId}/logs`), { text: `${myName} 離開房間`, timestamp: Date.now() }); } catch (e) {}
  await remove(ref(db, `rooms/${roomId}/players/${myUid}`));
  await remove(ref(db, `rooms/${roomId}/boards/${myUid}`));
  const remainSnap = await get(ref(db, `rooms/${roomId}/players`));
  const remain = remainSnap.val() || {};
  if (!Object.keys(remain).length) {
    await remove(ref(db, `rooms/${roomId}`));
  }
}

async function joinRoomById(roomId, pwdOrNull, skipPwdCheck) {
  // 避免「同時掛在多個房間」：切換房間前，先自動離開目前所在的房間
  if (currentRoomId && currentRoomId !== roomId) {
    if (!confirm("你目前在另一個房間，加入新房間會自動離開原本的房間，確定要繼續嗎？")) return;
    await leaveRoomCleanup(currentRoomId);
    clearSubs();
    currentRoomId = null;
  }

  const metaSnap = await get(ref(db, `rooms/${roomId}/meta`));
  if (!metaSnap.exists()) { alert("房間不存在"); return; }
  const meta = metaSnap.val();

  if (!skipPwdCheck && meta.hasPassword) {
    const hash = await sha256(pwdOrNull || "");
    if (hash !== meta.passwordHash) { alert("密碼錯誤"); return; }
  }

  const playersSnap = await get(ref(db, `rooms/${roomId}/players`));
  const allPlayers = playersSnap.val() || {};
  const already = allPlayers[myUid];

  await update(ref(db, `rooms/${roomId}/players/${myUid}`), {
    name: myName,
    joinedAt: already && already.joinedAt ? already.joinedAt : Date.now(),
    online: true
  });

  const boardSnap = await get(ref(db, `rooms/${roomId}/boards/${myUid}/numbers`));
  if (!boardSnap.exists()) {
    await set(ref(db, `rooms/${roomId}/boards/${myUid}`), { numbers: randomBoard(), version: 1 });
  }

  const myOrder = already && already.order;
  if (myOrder == null) {
    const used = new Set(Object.values(allPlayers).map(p => p.order).filter(v => v != null));
    let i = 1; while (used.has(i)) i++;
    await update(ref(db, `rooms/${roomId}/players/${myUid}`), { order: i });
  }

  currentRoomId = roomId;
  isHost = meta.hostId === myUid;
  hadValidMeta = false;
  localStorage.setItem("bingo_last_room", roomId);

  if (roomListUnsub) { roomListUnsub(); roomListUnsub = null; }

  showGame();
  pushLog(`${myName} 加入房間`);
  subscribeRoom();
  setupPresence(roomId);
}

/* ===== 显示切换 ===== */
function showLobby() {
  lobbySection.classList.remove("hidden");
  gameSection.classList.add("hidden");
  leaveRoomBtn.classList.add("hidden");
  toggleLobbyBtn.textContent = "收合房間設定";
  roomLabelEl.textContent = "";
}
function showGame() {
  lobbySection.classList.add("hidden");
  gameSection.classList.remove("hidden");
  leaveRoomBtn.classList.remove("hidden");
  toggleLobbyBtn.textContent = "顯示房間設定";
}
toggleLobbyBtn.addEventListener("click", () => {
  const hiding = !lobbySection.classList.contains("hidden");
  if (hiding) { lobbySection.classList.add("hidden"); toggleLobbyBtn.textContent = "顯示房間設定"; }
  else {
    lobbySection.classList.remove("hidden");
    toggleLobbyBtn.textContent = "收合房間設定";
    if (!currentRoomId) listenRoomList();
  }
});

/* ===== 離開房間 / 房間被刪除 ===== */
leaveRoomBtn.addEventListener("click", async () => {
  if (!currentRoomId) return;
  const roomId = currentRoomId;
  await leaveRoomCleanup(roomId);
  localStorage.removeItem("bingo_last_room");
  clearSubs();
  currentRoomId = null;
  showLobby();
  listenRoomList();
});

deleteRoomBtn.addEventListener("click", async () => {
  if (!isHost || !currentRoomId) return;
  if (!confirm("確定要刪除整個房間嗎？所有人都會被移出。")) return;
  await remove(ref(db, `rooms/${currentRoomId}`));
  // 其餘客戶端會透過 meta 監聽偵測到房間消失並自動回大廳
});

function handleRoomDeleted() {
  alert("房間已被刪除或已不存在");
  localStorage.removeItem("bingo_last_room");
  clearSubs();
  currentRoomId = null;
  showLobby();
  listenRoomList();
}

/* ===== 在線狀態（presence） ===== */
function setupPresence(roomId) {
  const myOnlineRef = ref(db, `rooms/${roomId}/players/${myUid}/online`);
  const connUnsub = onValue(ref(db, ".info/connected"), (snap) => {
    if (snap.val() === true) {
      onDisconnect(myOnlineRef).set(false);
      set(myOnlineRef, true);
    }
  });
  unsubs.push(connUnsub);
}

/* ===== 房主自動轉移 ===== */
/* 房主轉移設有 5 秒寬限時間，避免房主只是重新整理網頁（短暫斷線重連）就被誤判離線而搶走房主 */
let hostMigrationTimer = null;

function maybeClaimHost() {
  if (!currentRoomId || !roomMeta.hostId) return;
  const hostPlayer = players[roomMeta.hostId];
  const iAmOnline = players[myUid] && players[myUid].online === true;
  // 房主離線，或房主的玩家資料已經完全不存在（例如主動離開房間），都視為需要轉移
  const hostNeedsMigration = !hostPlayer || hostPlayer.online !== true;

  if (!hostNeedsMigration) {
    if (hostMigrationTimer) { clearTimeout(hostMigrationTimer); hostMigrationTimer = null; }
    return;
  }
  if (!iAmOnline) return;
  if (hostMigrationTimer) return; // 已經在等待寬限時間，不要重複排程

  hostMigrationTimer = setTimeout(() => {
    hostMigrationTimer = null;
    // 5 秒後重新確認一次房主是否仍然離線（可能剛好重整完重新連回來了）
    const hp = players[roomMeta.hostId];
    const stillNeeds = !hp || hp.online !== true;
    if (!stillNeeds) return;

    const onlineList = Object.entries(players).filter(([, p]) => p.online === true);
    if (!onlineList.length) return;
    onlineList.sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
    const candidateUid = onlineList[0][0];
    if (candidateUid === myUid && myUid !== roomMeta.hostId) {
      const oldHost = roomMeta.hostId;
      runTransaction(ref(db, `rooms/${currentRoomId}/meta/hostId`), (curr) => {
        if (curr === oldHost) return myUid;
        return; // 已被其他人搶先轉移，放棄
      }).then(res => {
        if (res.committed) pushLog(`${myName} 自動成為新房主（原房主已離開超過 5 秒）`);
      });
    }
  }, 5000);
}

/* ===== 房间内订阅 ===== */
function clearSubs() {
  unsubs.forEach(u => u && u());
  unsubs = [];
  if (hostMigrationTimer) { clearTimeout(hostMigrationTimer); hostMigrationTimer = null; }
}

function subscribeRoom() {
  clearSubs();

  unsubs.push(onValue(ref(db, `rooms/${currentRoomId}/meta`), (snap) => {
    const val = snap.val();
    if (val === null) {
      if (hadValidMeta) handleRoomDeleted();
      return;
    }
    hadValidMeta = true;
    roomMeta = val;
    isHost = roomMeta.hostId === myUid;
    roomLabelEl.textContent = `房間：${roomMeta.name || ""}　暱稱：${myName}`;

    const state = roomMeta.gameState || "lobby";
    lockBtn.textContent = state === "playing" ? "取消鎖定" : "鎖定";
    lockBtn.classList.toggle("hidden", !isHost);
    deleteRoomBtn.classList.toggle("hidden", !isHost);
    clearOrderBtn.disabled = !isHost || state !== "lobby";
    refreshCardBtn.disabled = state !== "lobby";

    renderPlayers();
    renderPublicGrid();
    renderTurnHint();
  }));

  unsubs.push(onValue(ref(db, `rooms/${currentRoomId}/players`), (snap) => {
    players = snap.val() || {};
    renderPlayers();
    renderTurnHint();
    renderReadyStatus();
    maybeClaimHost();
    const mine = players[myUid];
    if (mine && mine.brag) bragState = mine.brag;
    updateBragButton();
  }));

  unsubs.push(onValue(ref(db, `rooms/${currentRoomId}/calledNumbers`), (snap) => {
    calledNumbers = snap.val() || {};
    renderPublicGrid();
    renderMyCard();
    updateBingoCount();
  }));

  unsubs.push(onValue(ref(db, `rooms/${currentRoomId}/boards/${myUid}/numbers`), (snap) => {
    const arr = snap.val();
    myBoard = Array.isArray(arr) && arr.length === 25 ? arr : randomBoard();
    renderMyCard();
    updateBingoCount();
  }));

  unsubs.push(onValue(ref(db, `rooms/${currentRoomId}/logs`), (snap) => {
    const val = snap.val() || {};
    const list = Object.values(val).sort((a, b) => (a.timestamp||0) - (b.timestamp||0)).slice(-300);
    logBoxEl.textContent = list.map(l => {
      const t = new Date(l.timestamp || Date.now());
      const hh = String(t.getHours()).padStart(2,"0");
      const mm = String(t.getMinutes()).padStart(2,"0");
      const ss = String(t.getSeconds()).padStart(2,"0");
      return `[${hh}:${mm}:${ss}] ${l.text}`;
    }).join("\n");
    logBoxEl.scrollTop = logBoxEl.scrollHeight;
  }));

  unsubs.push(onValue(ref(db, `rooms/${currentRoomId}/prepare`), (snap) => {
    const active = !!(snap.val() && snap.val().active);
    if (active) { readyModal.classList.remove("hidden"); renderReadyStatus(); }
    else { readyModal.classList.add("hidden"); }
  }));
}

/* ===== 玩家列表 / 排序 ===== */
function renderPlayers() {
  playerListEl.innerHTML = "";
  const entries = Object.entries(players).sort((a, b) => {
    const oa = a[1].order ?? 9999, ob = b[1].order ?? 9999;
    if (oa !== ob) return oa - ob;
    return (a[1].name || "").localeCompare(b[1].name || "");
  });
  const state = roomMeta.gameState || "lobby";
  const circled = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮";

  entries.forEach(([uid, p]) => {
    const row = document.createElement("div");
    row.className = "player-row" + (uid === myUid ? " me" : "") + (p.online !== true ? " offline" : "");
    if (isHost && state === "lobby") row.classList.add("clickable");

    const icon = document.createElement("span");
    icon.textContent = uid === roomMeta.hostId ? "👑" : "👤";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (p.name || "(未命名)") + (p.online !== true ? "（離線）" : "");
    const badge = document.createElement("span");
    badge.className = "order-badge";
    badge.textContent = p.order ? (circled[p.order-1] || String(p.order)) : "";

    row.appendChild(icon); row.appendChild(name); row.appendChild(badge);

    // 房主可以隨時手動把房主身份移交給其他在線玩家
    if (isHost && uid !== myUid && p.online === true) {
      const transferBtn = document.createElement("button");
      transferBtn.className = "transfer-btn";
      transferBtn.title = `移交房主給 ${p.name || "此玩家"}`;
      transferBtn.textContent = "👑→";
      transferBtn.addEventListener("click", (e) => { e.stopPropagation(); transferHost(uid); });
      row.appendChild(transferBtn);
    }

    if (isHost && state === "lobby") row.addEventListener("click", () => togglePlayerOrder(uid));
    playerListEl.appendChild(row);
  });
}
function togglePlayerOrder(uid) {
  const p = players[uid];
  if (!p) return;
  const newOrder = p.order ? null : nextAvailableOrder();
  update(ref(db, `rooms/${currentRoomId}/players/${uid}`), { order: newOrder });
}
async function transferHost(targetUid) {
  if (!isHost || !currentRoomId || targetUid === myUid) return;
  const target = players[targetUid];
  if (!target) return;
  if (!confirm(`確定要將房主移交給「${target.name || "此玩家"}」嗎？`)) return;
  if (hostMigrationTimer) { clearTimeout(hostMigrationTimer); hostMigrationTimer = null; }
  await update(ref(db, `rooms/${currentRoomId}/meta`), { hostId: targetUid });
  pushLog(`${myName} 將房主移交給 ${target.name || "此玩家"}`);
}
clearOrderBtn.addEventListener("click", () => {
  if (!isHost || !currentRoomId) return;
  const updates = {};
  Object.keys(players).forEach(uid => { updates[`rooms/${currentRoomId}/players/${uid}/order`] = null; });
  update(ref(db), updates);
});

/* ===== 刷新卡片 ===== */
refreshCardBtn.addEventListener("click", () => {
  if (!currentRoomId || (roomMeta.gameState || "lobby") !== "lobby") return;
  set(ref(db, `rooms/${currentRoomId}/boards/${myUid}/numbers`), randomBoard());
  pushLog(`${myName} 刷新了卡片`);
});

/* ===== 锁定 / 准备流程 ===== */
lockBtn.addEventListener("click", async () => {
  if (!isHost || !currentRoomId) return;
  const state = roomMeta.gameState || "lobby";
  if (state === "lobby") {
    const list = Object.values(players);
    if (!list.length) { alert("目前沒有玩家"); return; }
    if (list.some(p => p.order == null)) { alert("請設置左側順位排序"); return; }
    const updates = {};
    Object.keys(players).forEach(uid => { updates[`rooms/${currentRoomId}/players/${uid}/ready`] = "waiting"; });
    updates[`rooms/${currentRoomId}/prepare`] = { active: true };
    updates[`rooms/${currentRoomId}/meta/gameState`] = "preparing";
    await update(ref(db), updates);
    pushLog("房主啟動準備流程");
  } else if (state === "playing") {
    if (!confirm("是否結束此局並清除所有公共號碼？")) return;
    const updates = {};
    updates[`rooms/${currentRoomId}/meta/gameState`] = "lobby";
    updates[`rooms/${currentRoomId}/meta/turnIndex`] = 0;
    updates[`rooms/${currentRoomId}/calledNumbers`] = null;
    Object.keys(players).forEach(uid => {
      updates[`rooms/${currentRoomId}/players/${uid}/ready`] = null;
      updates[`rooms/${currentRoomId}/players/${uid}/brag`] = null;
    });
    await update(ref(db), updates);
    pushLog("房主結束本局並清空公共號碼");
  }
});

readyBtn.addEventListener("click", () => {
  if (!currentRoomId) return;
  update(ref(db, `rooms/${currentRoomId}/players/${myUid}`), { ready: "ready" });
});
readyCancelBtn.addEventListener("click", async () => {
  if (!currentRoomId) return;
  const updates = {};
  updates[`rooms/${currentRoomId}/prepare`] = { active: false };
  updates[`rooms/${currentRoomId}/meta/gameState`] = "lobby";
  Object.keys(players).forEach(uid => { updates[`rooms/${currentRoomId}/players/${uid}/ready`] = null; });
  await update(ref(db), updates);
  pushLog(`${myName}：你們先別急`);
});
function renderReadyStatus() {
  readyStatusEl.innerHTML = "";
  Object.entries(players).forEach(([uid, p]) => {
    const row = document.createElement("div");
    row.className = "ready-status-row";
    const left = document.createElement("span");
    left.textContent = (uid === roomMeta.hostId ? "👑 " : "👤 ") + (p.name || "");
    const right = document.createElement("span");
    if (p.ready === "ready") { right.textContent = "已準備"; right.className = "st-ready"; }
    else { right.textContent = "等候準備"; right.className = "st-wait"; }
    row.appendChild(left); row.appendChild(right);
    readyStatusEl.appendChild(row);
  });
  const list = Object.values(players);
  if (isHost && list.length && list.every(p => p.ready === "ready") && roomMeta.gameState === "preparing") {
    const updates = {};
    updates[`rooms/${currentRoomId}/prepare`] = { active: false };
    updates[`rooms/${currentRoomId}/meta/gameState`] = "playing";
    update(ref(db), updates);
    pushLog("所有玩家已準備，遊戲開始");
  }
}

/* ===== 轮次提示 / 跳过离线玩家 ===== */
function currentTurnUid() {
  const ordered = orderedPlayers();
  if (!ordered.length) return null;
  const idx = (roomMeta.turnIndex || 0) % ordered.length;
  return ordered[idx][0];
}
function renderTurnHint() {
  const state = roomMeta.gameState || "lobby";
  if (state !== "playing") {
    turnHintEl.className = "turn-hint idle";
    turnHintEl.textContent = state === "preparing" ? "準備中…" : "尚未開始";
    skipTurnBtn.classList.add("hidden");
    return;
  }
  const uid = currentTurnUid();
  const p = uid && players[uid];
  turnHintEl.className = "turn-hint";
  turnHintEl.textContent = p ? `🌟 ${p.name}，請選號 🌟` : "";
  skipTurnBtn.classList.toggle("hidden", !(isHost && p && p.online !== true));
}
skipTurnBtn.addEventListener("click", async () => {
  if (!isHost || !currentRoomId) return;
  const uid = currentTurnUid();
  const p = uid && players[uid];
  await runTransaction(ref(db, `rooms/${currentRoomId}/meta/turnIndex`), (v) => (v || 0) + 1);
  pushLog(`房主跳過了 ${p ? p.name : "離線玩家"}（離線中）`);
});

/* ===== 号码渲染 / 点击 ===== */
function isMyTurn() {
  return (roomMeta.gameState === "playing") && currentTurnUid() === myUid;
}
function renderPublicGrid() {
  publicGridEl.innerHTML = "";
  const state = roomMeta.gameState || "lobby";
  for (let n = 1; n <= 50; n++) {
    const btn = document.createElement("button");
    btn.className = "num-btn" + (calledNumbers[n] ? " active" : "");
    btn.textContent = n;
    const canClick = state === "playing" && (isMyTurn() || (calledNumbers[n] && calledNumbers[n].by === myUid));
    btn.disabled = !canClick;
    btn.addEventListener("click", () => handleNumberClick(n));
    publicGridEl.appendChild(btn);
  }
}
function renderMyCard() {
  myCardEl.innerHTML = "";
  const state = roomMeta.gameState || "lobby";
  myBoard.forEach(n => {
    const btn = document.createElement("button");
    btn.className = "num-btn" + (calledNumbers[n] ? " active" : "");
    btn.textContent = n;
    const canClick = state === "playing" && (isMyTurn() || (calledNumbers[n] && calledNumbers[n].by === myUid));
    btn.disabled = !canClick;
    btn.addEventListener("click", () => handleNumberClick(n));
    myCardEl.appendChild(btn);
  });
}
async function handleNumberClick(num) {
  if (!currentRoomId || roomMeta.gameState !== "playing") return;
  const already = calledNumbers[num];

  if (already) {
    if (already.by !== myUid) return;
    await set(ref(db, `rooms/${currentRoomId}/calledNumbers/${num}`), null);
    pushLog(`${myName}：取消 ${num}`);
  } else {
    if (!isMyTurn()) return;
    const numRef = ref(db, `rooms/${currentRoomId}/calledNumbers/${num}`);
    const result = await runTransaction(numRef, (curr) => {
      if (curr) return; // 已被別人搶先叫走，放棄
      return { by: myUid, byName: myName, at: Date.now() };
    });
    if (!result.committed) return;
    await runTransaction(ref(db, `rooms/${currentRoomId}/meta/turnIndex`), (v) => (v || 0) + 1);
    pushLog(`${myName}：${num}`);
  }
}

/* ===== Bingo 计算 & 炫耀 ===== */
function updateBingoCount() {
  const selected = new Set(Object.keys(calledNumbers).map(Number));
  const lines = calcBingoLines(myBoard, selected);
  bingoCountEl.textContent = lines;
  updateBragButton(lines);
}
function updateBragButton(lines) {
  if (lines === undefined) {
    const selected = new Set(Object.keys(calledNumbers).map(Number));
    lines = calcBingoLines(myBoard, selected);
  }
  if (lines <= 0) { bragBtn.disabled = true; bragMsgEl.textContent = ""; return; }
  if (bragState.count !== lines) { bragBtn.disabled = false; bragMsgEl.textContent = ""; return; }
  if (bragState.locked) { bragBtn.disabled = true; bragMsgEl.textContent = "低調!低調!"; }
  else { bragBtn.disabled = false; bragMsgEl.textContent = ""; }
}
bragBtn.addEventListener("click", async () => {
  if (!currentRoomId) return;
  const selected = new Set(Object.keys(calledNumbers).map(Number));
  const lines = calcBingoLines(myBoard, selected);
  if (lines <= 0) return;

  let next;
  if (bragState.count !== lines) next = { count: lines, times: 1, locked: false };
  else {
    if (bragState.locked) return;
    const times = (bragState.times || 0) + 1;
    next = { count: lines, times, locked: times >= 3 };
  }
  bragState = next;
  await update(ref(db, `rooms/${currentRoomId}/players/${myUid}`), { brag: next });
  pushLog(`${myName}：我已經 ${lines} 條 BINGO！`);
  updateBragButton(lines);
});
</script>
